<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc"><title id="title">Combine, transform, pass onward</title><desc id="desc">A schematic neural layer combines two inputs into three hidden values and one output. Connections represent learned weighted contributions, not fixed numerical results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9be6d6"/></marker></defs><rect width="480" height="270" rx="16" fill="#101b2d"/><text x="22" y="31" fill="#ffffff" font-size="18" font-family="Segoe UI,Arial,sans-serif">Combine, transform, pass onward</text><line x1="80" y1="90" x2="230" y2="70" stroke="#526581" stroke-width="2"/><line x1="80" y1="90" x2="230" y2="130" stroke="#526581" stroke-width="2"/><line x1="80" y1="90" x2="230" y2="190" stroke="#526581" stroke-width="2"/><line x1="80" y1="170" x2="230" y2="70" stroke="#526581" stroke-width="2"/><line x1="80" y1="170" x2="230" y2="130" stroke="#526581" stroke-width="2"/><line x1="80" y1="170" x2="230" y2="190" stroke="#526581" stroke-width="2"/><line x1="230" y1="70" x2="395" y2="130" stroke="#526581" stroke-width="2"/><line x1="230" y1="130" x2="395" y2="130" stroke="#526581" stroke-width="2"/><line x1="230" y1="190" x2="395" y2="130" stroke="#526581" stroke-width="2"/><circle cx="80" cy="90" r="17" fill="#9be6d6"/><circle cx="80" cy="170" r="17" fill="#9be6d6"/><circle cx="230" cy="70" r="17" fill="#c2b3ff"/><circle cx="230" cy="130" r="17" fill="#c2b3ff"/><circle cx="230" cy="190" r="17" fill="#c2b3ff"/><circle cx="395" cy="130" r="17" fill="#f0c884"/><text x="53" y="232" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Inputs</text><text x="183" y="232" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Hidden values</text><text x="367" y="232" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Output</text><text x="24" y="260" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Forward: values. Backward: gradients.</text></svg>