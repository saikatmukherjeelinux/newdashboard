<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc"><title id="title">Direction, length and projection</title><desc id="desc">The vector (3,4) has length 5. Its horizontal projection is (3,0). Dashed lines mark its coordinates.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9be6d6"/></marker></defs><rect width="480" height="270" rx="16" fill="#101b2d"/><text x="22" y="31" fill="#ffffff" font-size="18" font-family="Segoe UI,Arial,sans-serif">Direction, length and projection</text><line x1="65" y1="215" x2="425" y2="215" stroke="#526581" stroke-width="2"/><line x1="65" y1="215" x2="65" y2="52" stroke="#526581" stroke-width="2"/><line x1="65" y1="215" x2="170" y2="75" stroke="#9be6d6" stroke-width="2" marker-end="url(#arrow)"/><line x1="65" y1="215" x2="170" y2="215" stroke="#c2b3ff" stroke-width="2" marker-end="url(#arrow)"/><path d="M170 75V215" fill="none" stroke="#c2b3ff" stroke-dasharray="5 5"/><text x="181" y="78" fill="#dce8ff" font-size="16" font-family="Segoe UI,Arial,sans-serif">(3,4)</text><text x="234" y="133" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">length = √(3²+4²) = 5</text><text x="91" y="242" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">projection (3,0)</text><text x="180" y="158" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">4</text><text x="113" y="205" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">3</text></svg>