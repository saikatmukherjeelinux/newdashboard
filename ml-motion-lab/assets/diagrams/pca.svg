<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc"><title id="title">Find the main direction of variation</title><desc id="desc">A cloud of points is elongated along a diagonal direction. PCA projects centered data onto such directions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9be6d6"/></marker></defs><rect width="480" height="270" rx="16" fill="#101b2d"/><text x="22" y="31" fill="#ffffff" font-size="18" font-family="Segoe UI,Arial,sans-serif">Find the main direction of variation</text><line x1="50" y1="214" x2="425" y2="214" stroke="#526581" stroke-width="2"/><line x1="50" y1="214" x2="50" y2="52" stroke="#526581" stroke-width="2"/><line x1="85" y1="210" x2="395" y2="65" stroke="#c2b3ff" stroke-width="2" marker-end="url(#arrow)"/><circle cx="110" cy="192" r="5" fill="#9be6d6"/><circle cx="150" cy="173" r="5" fill="#9be6d6"/><circle cx="183" cy="180" r="5" fill="#9be6d6"/><circle cx="214" cy="143" r="5" fill="#9be6d6"/><circle cx="250" cy="139" r="5" fill="#9be6d6"/><circle cx="285" cy="108" r="5" fill="#9be6d6"/><circle cx="325" cy="102" r="5" fill="#9be6d6"/><circle cx="360" cy="74" r="5" fill="#9be6d6"/><text x="125" y="58" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">First principal direction</text><text x="64" y="246" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Projection gives one coordinate per point.</text></svg>