<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc"><title id="title">Check the dimensions first</title><desc id="desc">A batch with five rows and three features multiplied by a three by two weight matrix gives five rows and two outputs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9be6d6"/></marker></defs><rect width="480" height="270" rx="16" fill="#101b2d"/><text x="22" y="31" fill="#ffffff" font-size="18" font-family="Segoe UI,Arial,sans-serif">Check the dimensions first</text><rect x="24" y="81" width="123" height="90" rx="12" fill="#1c2b43" stroke="#9be6d6"/><text x="36" y="132.0" fill="#9be6d6" font-size="16" font-family="Segoe UI,Arial,sans-serif">X: 5 × 3</text><text x="158" y="132" fill="#dce8ff" font-size="24" font-family="Segoe UI,Arial,sans-serif">×</text><rect x="185" y="81" width="123" height="90" rx="12" fill="#1c2b43" stroke="#c2b3ff"/><text x="197" y="132.0" fill="#c2b3ff" font-size="16" font-family="Segoe UI,Arial,sans-serif">W: 3 × 2</text><text x="319" y="132" fill="#dce8ff" font-size="24" font-family="Segoe UI,Arial,sans-serif">=</text><rect x="347" y="81" width="109" height="90" rx="12" fill="#1c2b43" stroke="#9be6d6"/><text x="359" y="132.0" fill="#9be6d6" font-size="16" font-family="Segoe UI,Arial,sans-serif">Y: 5 × 2</text><text x="54" y="211" fill="#dce8ff" font-size="16" font-family="Segoe UI,Arial,sans-serif">Inner sizes match: 3 and 3</text><text x="54" y="241" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Outer sizes become the result: 5 and 2</text></svg>