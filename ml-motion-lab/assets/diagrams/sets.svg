<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc"><title id="title">Combine or restrict events</title><desc id="desc">Two overlapping event circles illustrate union and intersection. Conditioning restricts attention to a known event.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9be6d6"/></marker></defs><rect width="480" height="270" rx="16" fill="#101b2d"/><text x="22" y="31" fill="#ffffff" font-size="18" font-family="Segoe UI,Arial,sans-serif">Combine or restrict events</text><circle cx="190" cy="143" r="74" fill="#9be6d6" fill-opacity="0.15" stroke="#9be6d6"/><circle cx="290" cy="143" r="74" fill="#c2b3ff" fill-opacity="0.18" stroke="#c2b3ff"/><text x="149" y="145" fill="#dce8ff" font-size="23" font-family="Segoe UI,Arial,sans-serif">A</text><text x="315" y="145" fill="#dce8ff" font-size="23" font-family="Segoe UI,Arial,sans-serif">B</text><text x="220" y="145" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">A∩B</text><text x="35" y="248" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Union: either circle. Intersection: their overlap.</text></svg>