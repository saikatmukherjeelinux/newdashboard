<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc"><title id="title">Slope changes a prediction</title><desc id="desc">The straight line y=2x+1 rises by 2 when x increases by 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9be6d6"/></marker></defs><rect width="480" height="270" rx="16" fill="#101b2d"/><text x="22" y="31" fill="#ffffff" font-size="18" font-family="Segoe UI,Arial,sans-serif">Slope changes a prediction</text><line x1="65" y1="217" x2="430" y2="217" stroke="#526581" stroke-width="2"/><line x1="65" y1="217" x2="65" y2="52" stroke="#526581" stroke-width="2"/><polyline points="65.00,187.00 355.00,67.00" fill="none" stroke="#9be6d6" stroke-width="3"/><text x="359" y="66" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">y = 2x + 1</text><line x1="162" y1="147" x2="259" y2="147" stroke="#c2b3ff" stroke-width="2"/><line x1="259" y1="147" x2="259" y2="107" stroke="#c2b3ff" stroke-width="2"/><text x="177" y="169" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Δx = 1</text><text x="269" y="132" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Δy = 2</text><text x="426" y="241" fill="#dce8ff" font-size="16" font-family="Segoe UI,Arial,sans-serif">x</text><text x="40" y="58" fill="#dce8ff" font-size="16" font-family="Segoe UI,Arial,sans-serif">y</text><text x="56" y="239" fill="#dce8ff" font-size="16" font-family="Segoe UI,Arial,sans-serif">0</text><text x="24" y="259" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Slope = output change / input change</text></svg>