<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc"><title id="title">Turn scores into probabilities</title><desc id="desc">Softmax converts scores zero and log three into probabilities one quarter and three quarters.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9be6d6"/></marker></defs><rect width="480" height="270" rx="16" fill="#101b2d"/><text x="22" y="31" fill="#ffffff" font-size="18" font-family="Segoe UI,Arial,sans-serif">Turn scores into probabilities</text><text x="30" y="68" fill="#dce8ff" font-size="16" font-family="Segoe UI,Arial,sans-serif">Scores: [0, ln 3]</text><rect x="30" y="91" width="125" height="52" rx="12" fill="#1c2b43" stroke="#9be6d6"/><text x="42" y="123.0" fill="#9be6d6" font-size="16" font-family="Segoe UI,Arial,sans-serif">softmax</text><line x1="157" y1="116" x2="194" y2="116" stroke="#9be6d6" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="167" width="60" height="45" rx="6" fill="#9be6d6"/><rect x="330" y="77" width="60" height="135" rx="6" fill="#c2b3ff"/><text x="240" y="154" fill="#dce8ff" font-size="16" font-family="Segoe UI,Arial,sans-serif">0.25</text><text x="340" y="64" fill="#dce8ff" font-size="16" font-family="Segoe UI,Arial,sans-serif">0.75</text><text x="233" y="238" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">class 1</text><text x="333" y="238" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">class 2</text><text x="24" y="260" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Probabilities are nonnegative and sum to 1.</text></svg>