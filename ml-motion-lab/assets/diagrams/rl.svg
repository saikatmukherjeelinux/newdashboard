<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc"><title id="title">Immediate and future rewards</title><desc id="desc">Immediate and future rewards. Reward now: 2. Next reward: 4. Discount γ: 0.5. Return = 2 + 0.5 × 4 = 4</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9be6d6"/></marker></defs><rect width="480" height="270" rx="16" fill="#101b2d"/><text x="22" y="31" fill="#ffffff" font-size="18" font-family="Segoe UI,Arial,sans-serif">Immediate and future rewards</text><rect x="20" y="74" width="132" height="116" rx="12" fill="#1c2b43" stroke="#9be6d6"/><text x="29" y="104" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Reward now</text><text x="29" y="147" fill="#9be6d6" font-size="16" font-family="Segoe UI,Arial,sans-serif">2</text><line x1="154" y1="132" x2="171" y2="132" stroke="#9be6d6" stroke-width="2" marker-end="url(#arrow)"/><rect x="174" y="74" width="132" height="116" rx="12" fill="#1c2b43" stroke="#c2b3ff"/><text x="183" y="104" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Next reward</text><text x="183" y="147" fill="#c2b3ff" font-size="16" font-family="Segoe UI,Arial,sans-serif">4</text><line x1="308" y1="132" x2="325" y2="132" stroke="#9be6d6" stroke-width="2" marker-end="url(#arrow)"/><rect x="328" y="74" width="132" height="116" rx="12" fill="#1c2b43" stroke="#f0c884"/><text x="337" y="104" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Discount γ</text><text x="337" y="147" fill="#f0c884" font-size="16" font-family="Segoe UI,Arial,sans-serif">0.5</text><text x="20" y="224" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Return = 2 + 0.5 × 4 = 4</text></svg>