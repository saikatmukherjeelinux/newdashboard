<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc"><title id="title">From examples to learning</title><desc id="desc">Inputs and parameters produce a prediction. Compare it with a target to obtain loss, then use gradients to update parameters.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9be6d6"/></marker></defs><rect width="480" height="270" rx="16" fill="#101b2d"/><text x="22" y="31" fill="#ffffff" font-size="18" font-family="Segoe UI,Arial,sans-serif">From examples to learning</text><rect x="24" y="69" width="120" height="48" rx="12" fill="#1c2b43" stroke="#9be6d6"/><text x="36" y="99.0" fill="#9be6d6" font-size="16" font-family="Segoe UI,Arial,sans-serif">Inputs x</text><rect x="181" y="69" width="120" height="48" rx="12" fill="#1c2b43" stroke="#9be6d6"/><text x="193" y="99.0" fill="#9be6d6" font-size="16" font-family="Segoe UI,Arial,sans-serif">Model f(x)</text><rect x="338" y="69" width="120" height="48" rx="12" fill="#1c2b43" stroke="#9be6d6"/><text x="350" y="99.0" fill="#9be6d6" font-size="16" font-family="Segoe UI,Arial,sans-serif">Prediction</text><line x1="144" y1="93" x2="179" y2="93" stroke="#9be6d6" stroke-width="2" marker-end="url(#arrow)"/><line x1="301" y1="93" x2="336" y2="93" stroke="#9be6d6" stroke-width="2" marker-end="url(#arrow)"/><rect x="181" y="168" width="120" height="48" rx="12" fill="#1c2b43" stroke="#9be6d6"/><text x="193" y="198.0" fill="#9be6d6" font-size="16" font-family="Segoe UI,Arial,sans-serif">Loss</text><line x1="397" y1="119" x2="300" y2="168" stroke="#9be6d6" stroke-width="2" marker-end="url(#arrow)"/><text x="23" y="158" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Observed target y</text><line x1="115" y1="163" x2="180" y2="183" stroke="#9be6d6" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="243" fill="#dce8ff" font-size="14" font-family="Segoe UI,Arial,sans-serif">Gradients tell us how to change the parameters.</text></svg>