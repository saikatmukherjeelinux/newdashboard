<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">Inside the kernel</title><desc id="desc">Several jobs cooperate to keep programs running.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">Inside the kernel</text><text x="46" y="128" fill="#a8bcd2" font-size="17">Several jobs cooperate to keep programs running.</text><rect x="310" y="175" width="340" height="100" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="328" y="195" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="346" y="215" fill="#7fe3ca" font-size="23" font-weight="650">KERNEL</text><text x="332" y="247" fill="#d5e2ee" font-size="18">Protected system services</text><path d="M480,275 L175,340" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M480,275 L485,340" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M480,275 L795,340" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M480,275 L325,490" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M480,275 L635,490" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="340" width="270" height="110" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="58" y="360" width="5" height="26" rx="2" fill="#8abfff"/><text x="76" y="380" fill="#8abfff" font-size="23" font-weight="650">CPU SCHEDULER</text><text x="62" y="412" fill="#d5e2ee" font-size="18">Choose runnable work.</text><rect x="350" y="340" width="270" height="110" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="368" y="360" width="5" height="26" rx="2" fill="#8abfff"/><text x="386" y="380" fill="#8abfff" font-size="23" font-weight="650">MEMORY</text><text x="372" y="412" fill="#d5e2ee" font-size="18">Map and protect pages.</text><rect x="660" y="340" width="270" height="110" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="678" y="360" width="5" height="26" rx="2" fill="#8abfff"/><text x="696" y="380" fill="#8abfff" font-size="23" font-weight="650">FILESYSTEMS</text><text x="682" y="412" fill="#d5e2ee" font-size="18">Resolve paths and</text><text x="682" y="436" fill="#d5e2ee" font-size="18">files.</text><rect x="190" y="490" width="270" height="110" rx="16" fill="#15283e" stroke="#c5adff" stroke-opacity=".55"/><rect x="208" y="510" width="5" height="26" rx="2" fill="#c5adff"/><text x="226" y="530" fill="#c5adff" font-size="23" font-weight="650">DEVICE DRIVERS</text><text x="212" y="562" fill="#d5e2ee" font-size="18">Communicate with</text><text x="212" y="586" fill="#d5e2ee" font-size="18">hardware.</text><rect x="500" y="490" width="270" height="110" rx="16" fill="#15283e" stroke="#c5adff" stroke-opacity=".55"/><rect x="518" y="510" width="5" height="26" rx="2" fill="#c5adff"/><text x="536" y="530" fill="#c5adff" font-size="23" font-weight="650">NETWORK STACK</text><text x="522" y="562" fill="#d5e2ee" font-size="18">Move data between</text><text x="522" y="586" fill="#d5e2ee" font-size="18">sockets.</text><text x="46" y="649" fill="#9db4ca" font-size="15">Conceptual responsibilities; actual subsystem boundaries vary between kernels.</text></g></svg>