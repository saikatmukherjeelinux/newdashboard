<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">Processes: create, run, finish</title><desc id="desc">The classic fork → exec → wait idea.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">Processes: create, run, finish</text><text x="46" y="128" fill="#a8bcd2" font-size="17">The classic fork → exec → wait idea.</text><rect x="50" y="200" width="340" height="130" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="68" y="220" width="5" height="26" rx="2" fill="#8abfff"/><text x="86" y="240" fill="#8abfff" font-size="23" font-weight="650">PARENT SHELL</text><text x="72" y="272" fill="#d5e2ee" font-size="18">PID 1200 — waits for a</text><text x="72" y="296" fill="#d5e2ee" font-size="18">foreground command.</text><rect x="560" y="200" width="340" height="130" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="578" y="220" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="596" y="240" fill="#7fe3ca" font-size="23" font-weight="650">CHILD PROCESS</text><text x="582" y="272" fill="#d5e2ee" font-size="18">fork creates a child with a</text><text x="582" y="296" fill="#d5e2ee" font-size="18">new PID.</text><path d="M390,265 L550,265" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="425" width="340" height="140" rx="16" fill="#15283e" stroke="#c5adff" stroke-opacity=".55"/><rect x="578" y="445" width="5" height="26" rx="2" fill="#c5adff"/><text x="596" y="465" fill="#c5adff" font-size="23" font-weight="650">PROGRAM: cat</text><text x="582" y="497" fill="#d5e2ee" font-size="18">exec replaces the child’s</text><text x="582" y="521" fill="#d5e2ee" font-size="18">program. Its PID stays the</text><text x="582" y="545" fill="#d5e2ee" font-size="18">same.</text><path d="M730,330 L730,415" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="425" width="340" height="140" rx="16" fill="#15283e" stroke="#f1ca80" stroke-opacity=".55"/><rect x="68" y="445" width="5" height="26" rx="2" fill="#f1ca80"/><text x="86" y="465" fill="#f1ca80" font-size="23" font-weight="650">EXIT STATUS</text><text x="72" y="497" fill="#d5e2ee" font-size="18">The parent collects the</text><text x="72" y="521" fill="#d5e2ee" font-size="18">child’s result and shows a</text><text x="72" y="545" fill="#d5e2ee" font-size="18">prompt.</text><path d="M550,495 L400,495" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><text x="46" y="649" fill="#9db4ca" font-size="15">PID values are fictional. Process creation can use mechanisms other than this classic model.</text></g></svg>