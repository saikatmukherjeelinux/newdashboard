<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">From power-on to a user session</title><desc id="desc">A common Linux path — other Unix systems differ.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">From power-on to a user session</text><text x="46" y="128" fill="#a8bcd2" font-size="17">A common Linux path — other Unix systems differ.</text><rect x="45" y="200" width="260" height="150" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="63" y="220" width="5" height="26" rx="2" fill="#8abfff"/><text x="81" y="240" fill="#8abfff" font-size="23" font-weight="650">1  FIRMWARE</text><text x="67" y="272" fill="#d5e2ee" font-size="18">Prepare the machine.</text><path d="M305,275 L340,275" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="200" width="260" height="150" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="368" y="220" width="5" height="26" rx="2" fill="#8abfff"/><text x="386" y="240" fill="#8abfff" font-size="23" font-weight="650">2  BOOTLOADER</text><text x="372" y="272" fill="#d5e2ee" font-size="18">Load the selected</text><text x="372" y="296" fill="#d5e2ee" font-size="18">kernel.</text><path d="M610,275 L645,275" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="655" y="200" width="260" height="150" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="673" y="220" width="5" height="26" rx="2" fill="#8abfff"/><text x="691" y="240" fill="#8abfff" font-size="23" font-weight="650">3  KERNEL</text><text x="677" y="272" fill="#d5e2ee" font-size="18">Initialize core</text><text x="677" y="296" fill="#d5e2ee" font-size="18">services.</text><rect x="45" y="430" width="260" height="150" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="63" y="450" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="81" y="470" fill="#7fe3ca" font-size="23" font-weight="650">4  EARLY USERSPACE</text><text x="67" y="502" fill="#d5e2ee" font-size="18">Prepare the root</text><text x="67" y="526" fill="#d5e2ee" font-size="18">filesystem.</text><path d="M305,505 L340,505" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="430" width="260" height="150" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="368" y="450" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="386" y="470" fill="#7fe3ca" font-size="23" font-weight="650">5  SYSTEM MANAGER</text><text x="372" y="502" fill="#d5e2ee" font-size="18">Start and supervise</text><text x="372" y="526" fill="#d5e2ee" font-size="18">services.</text><path d="M610,505 L645,505" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="655" y="430" width="260" height="150" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="673" y="450" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="691" y="470" fill="#7fe3ca" font-size="23" font-weight="650">6  LOGIN / SESSION</text><text x="677" y="502" fill="#d5e2ee" font-size="18">Start a shell or</text><text x="677" y="526" fill="#d5e2ee" font-size="18">desktop.</text><text x="46" y="392" fill="#9db4ca" font-size="16">Continue with step 4 below ↓</text><text x="46" y="649" fill="#9db4ca" font-size="15">systemd is common on Linux, not universal Unix. macOS uses launchd; BSD systems differ.</text></g></svg>