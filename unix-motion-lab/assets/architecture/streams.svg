<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">Standard streams connect programs</title><desc id="desc">0 = input   ·   1 = normal output   ·   2 = error output</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">Standard streams connect programs</text><text x="46" y="128" fill="#a8bcd2" font-size="17">0 = input   ·   1 = normal output   ·   2 = error output</text><rect x="40" y="220" width="245" height="145" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="58" y="240" width="5" height="26" rx="2" fill="#8abfff"/><text x="76" y="260" fill="#8abfff" font-size="23" font-weight="650">PROGRAM A</text><text x="62" y="292" fill="#d5e2ee" font-size="18">Reads data and</text><text x="62" y="316" fill="#d5e2ee" font-size="18">writes bytes to</text><text x="62" y="340" fill="#d5e2ee" font-size="18">stdout (1).</text><rect x="355" y="220" width="250" height="145" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="373" y="240" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="391" y="260" fill="#7fe3ca" font-size="23" font-weight="650">KERNEL PIPE</text><text x="377" y="292" fill="#d5e2ee" font-size="18">Buffered bytes</text><text x="377" y="316" fill="#d5e2ee" font-size="18">connect the two</text><text x="377" y="340" fill="#d5e2ee" font-size="18">processes.</text><rect x="675" y="220" width="245" height="145" rx="16" fill="#15283e" stroke="#c5adff" stroke-opacity=".55"/><rect x="693" y="240" width="5" height="26" rx="2" fill="#c5adff"/><text x="711" y="260" fill="#c5adff" font-size="23" font-weight="650">PROGRAM B</text><text x="697" y="292" fill="#d5e2ee" font-size="18">Reads those bytes</text><text x="697" y="316" fill="#d5e2ee" font-size="18">from stdin (0).</text><path d="M285,295 L345,295" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M605,295 L665,295" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="470" width="340" height="105" rx="16" fill="#15283e" stroke="#f1ca80" stroke-opacity=".55"/><rect x="108" y="490" width="5" height="26" rx="2" fill="#f1ca80"/><text x="126" y="510" fill="#f1ca80" font-size="23" font-weight="650">ERROR STREAM (2)</text><text x="112" y="542" fill="#d5e2ee" font-size="18">Separate unless redirected</text><path d="M160,365 L250,460" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="555" y="470" width="340" height="105" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="573" y="490" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="591" y="510" fill="#7fe3ca" font-size="23" font-weight="650">FINAL OUTPUT (1)</text><text x="577" y="542" fill="#d5e2ee" font-size="18">Terminal, file or another</text><text x="577" y="566" fill="#d5e2ee" font-size="18">pipe</text><path d="M800,365 L730,460" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><text x="46" y="649" fill="#9db4ca" font-size="15">The shell sets up the connections. A pipe carries bytes; it does not interpret rows or columns.</text></g></svg>