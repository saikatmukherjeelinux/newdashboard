<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">Read permissions as three groups</title><desc id="desc">Example: 640 → rw- r-- ---</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">Read permissions as three groups</text><text x="46" y="128" fill="#a8bcd2" font-size="17">Example: 640 → rw- r-- ---</text><rect x="45" y="205" width="260" height="145" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="63" y="225" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="81" y="245" fill="#7fe3ca" font-size="23" font-weight="650">OWNER: 6</text><text x="67" y="277" fill="#d5e2ee" font-size="18">4 + 2 = read and</text><text x="67" y="301" fill="#d5e2ee" font-size="18">write</text><rect x="350" y="205" width="260" height="145" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="368" y="225" width="5" height="26" rx="2" fill="#8abfff"/><text x="386" y="245" fill="#8abfff" font-size="23" font-weight="650">GROUP: 4</text><text x="372" y="277" fill="#d5e2ee" font-size="18">4 = read only</text><rect x="655" y="205" width="260" height="145" rx="16" fill="#15283e" stroke="#c5adff" stroke-opacity=".55"/><rect x="673" y="225" width="5" height="26" rx="2" fill="#c5adff"/><text x="691" y="245" fill="#c5adff" font-size="23" font-weight="650">OTHERS: 0</text><text x="677" y="277" fill="#d5e2ee" font-size="18">0 = no mode-bit</text><text x="677" y="301" fill="#d5e2ee" font-size="18">access</text><rect x="80" y="425" width="380" height="140" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="98" y="445" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="116" y="465" fill="#7fe3ca" font-size="23" font-weight="650">ORDINARY FILE</text><text x="102" y="497" fill="#d5e2ee" font-size="18">r: read contents w: change</text><text x="102" y="521" fill="#d5e2ee" font-size="18">contents x: execute</text><rect x="500" y="425" width="380" height="140" rx="16" fill="#15283e" stroke="#f1ca80" stroke-opacity=".55"/><rect x="518" y="445" width="5" height="26" rx="2" fill="#f1ca80"/><text x="536" y="465" fill="#f1ca80" font-size="23" font-weight="650">DIRECTORY</text><text x="522" y="497" fill="#d5e2ee" font-size="18">r: list names; x: traverse. w +</text><text x="522" y="521" fill="#d5e2ee" font-size="18">x: change entries.</text><text x="46" y="649" fill="#9db4ca" font-size="15">Owner/group/other is the basic model. ACLs, privilege and other security policies can add rules.</text></g></svg>