<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">The layers of a Unix system</title><desc id="desc">A useful map — not a rule that every request takes the same path.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">The layers of a Unix system</text><text x="46" y="128" fill="#a8bcd2" font-size="17">A useful map — not a rule that every request takes the same path.</text><rect x="100" y="165" width="760" height="86" rx="16" fill="#15283e" stroke="#f1ca80" stroke-opacity=".55"/><rect x="118" y="185" width="5" height="26" rx="2" fill="#f1ca80"/><text x="136" y="205" fill="#f1ca80" font-size="23" font-weight="650">YOU</text><text x="122" y="237" fill="#d5e2ee" font-size="18">Choose a task: read, write, run or connect.</text><rect x="100" y="267" width="760" height="86" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="118" y="287" width="5" height="26" rx="2" fill="#8abfff"/><text x="136" y="307" fill="#8abfff" font-size="23" font-weight="650">USER SPACE</text><text x="122" y="339" fill="#d5e2ee" font-size="18">Terminal • shell • applications • libraries</text><rect x="100" y="389" width="760" height="86" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="118" y="409" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="136" y="429" fill="#7fe3ca" font-size="23" font-weight="650">KERNEL</text><text x="122" y="461" fill="#d5e2ee" font-size="18">Processes • memory • files • devices • network</text><rect x="100" y="511" width="760" height="86" rx="16" fill="#15283e" stroke="#c5adff" stroke-opacity=".55"/><rect x="118" y="531" width="5" height="26" rx="2" fill="#c5adff"/><text x="136" y="551" fill="#c5adff" font-size="23" font-weight="650">HARDWARE</text><text x="122" y="583" fill="#d5e2ee" font-size="18">CPU • RAM • storage • network interface</text><path d="M480,251 L480,267" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M480,353 L480,389" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M480,475 L480,511" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><text x="46" y="649" fill="#9db4ca" font-size="15">System calls cross the user/kernel boundary. Applications do not have to go through a shell.</text></g></svg>