<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">One command, eight small steps</title><desc id="desc">Follow cat notes.txt from your keyboard to the next prompt.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">One command, eight small steps</text><text x="46" y="128" fill="#a8bcd2" font-size="17">Follow cat notes.txt from your keyboard to the next prompt.</text><rect x="36" y="185" width="204" height="175" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="54" y="205" width="5" height="26" rx="2" fill="#8abfff"/><text x="72" y="225" fill="#8abfff" font-size="23" font-weight="650">1  TYPE</text><text x="58" y="257" fill="#d5e2ee" font-size="18">The terminal</text><text x="58" y="281" fill="#d5e2ee" font-size="18">receives your</text><text x="58" y="305" fill="#d5e2ee" font-size="18">text.</text><path d="M240,273 L264,273" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="268" y="185" width="204" height="175" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="286" y="205" width="5" height="26" rx="2" fill="#8abfff"/><text x="304" y="225" fill="#8abfff" font-size="23" font-weight="650">2  INTERPRET</text><text x="290" y="257" fill="#d5e2ee" font-size="18">The shell reads</text><text x="290" y="281" fill="#d5e2ee" font-size="18">command and</text><text x="290" y="305" fill="#d5e2ee" font-size="18">arguments.</text><path d="M472,273 L496,273" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="185" width="204" height="175" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="518" y="205" width="5" height="26" rx="2" fill="#8abfff"/><text x="536" y="225" fill="#8abfff" font-size="23" font-weight="650">3  START</text><text x="522" y="257" fill="#d5e2ee" font-size="18">A process runs</text><text x="522" y="281" fill="#d5e2ee" font-size="18">the cat</text><text x="522" y="305" fill="#d5e2ee" font-size="18">program.</text><path d="M704,273 L728,273" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="732" y="185" width="204" height="175" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="750" y="205" width="5" height="26" rx="2" fill="#8abfff"/><text x="768" y="225" fill="#8abfff" font-size="23" font-weight="650">4  OPEN</text><text x="754" y="257" fill="#d5e2ee" font-size="18">The kernel</text><text x="754" y="281" fill="#d5e2ee" font-size="18">checks the file</text><text x="754" y="305" fill="#d5e2ee" font-size="18">request.</text><rect x="36" y="400" width="204" height="175" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="54" y="420" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="72" y="440" fill="#7fe3ca" font-size="23" font-weight="650">5  READ</text><text x="58" y="472" fill="#d5e2ee" font-size="18">Bytes come from</text><text x="58" y="496" fill="#d5e2ee" font-size="18">cache or</text><text x="58" y="520" fill="#d5e2ee" font-size="18">storage.</text><path d="M240,488 L264,488" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="268" y="400" width="204" height="175" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="286" y="420" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="304" y="440" fill="#7fe3ca" font-size="23" font-weight="650">6  WRITE</text><text x="290" y="472" fill="#d5e2ee" font-size="18">Output goes to</text><text x="290" y="496" fill="#d5e2ee" font-size="18">the terminal.</text><path d="M472,488 L496,488" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="400" width="204" height="175" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="518" y="420" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="536" y="440" fill="#7fe3ca" font-size="23" font-weight="650">7  FINISH</text><text x="522" y="472" fill="#d5e2ee" font-size="18">Cat exits with</text><text x="522" y="496" fill="#d5e2ee" font-size="18">a result code.</text><path d="M704,488 L728,488" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="732" y="400" width="204" height="175" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="750" y="420" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="768" y="440" fill="#7fe3ca" font-size="23" font-weight="650">8  READY</text><text x="754" y="472" fill="#d5e2ee" font-size="18">The shell shows</text><text x="754" y="496" fill="#d5e2ee" font-size="18">a new prompt.</text><text x="44" y="390" fill="#9db4ca" font-size="15">Continue with step 5 on the next row ↓</text><text x="46" y="649" fill="#9db4ca" font-size="15">Simplified external-command path. Built-ins and implementation details can differ.</text></g></svg>