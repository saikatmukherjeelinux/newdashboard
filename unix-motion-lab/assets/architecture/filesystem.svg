<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">One file tree, many possible disks</title><desc id="desc">Paths begin at / — the root directory.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">One file tree, many possible disks</text><text x="46" y="128" fill="#a8bcd2" font-size="17">Paths begin at / — the root directory.</text><rect x="355" y="170" width="250" height="90" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="373" y="190" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="391" y="210" fill="#7fe3ca" font-size="23" font-weight="650">/</text><text x="377" y="242" fill="#d5e2ee" font-size="18">Root of the tree</text><rect x="40" y="330" width="190" height="115" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="58" y="350" width="5" height="26" rx="2" fill="#8abfff"/><text x="76" y="370" fill="#8abfff" font-size="23" font-weight="650">/etc</text><text x="62" y="402" fill="#d5e2ee" font-size="18">System</text><text x="62" y="426" fill="#d5e2ee" font-size="18">settings</text><path d="M480,260 L135,320" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="330" width="190" height="115" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="288" y="350" width="5" height="26" rx="2" fill="#8abfff"/><text x="306" y="370" fill="#8abfff" font-size="23" font-weight="650">/home</text><text x="292" y="402" fill="#d5e2ee" font-size="18">User folders</text><path d="M480,260 L365,320" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="330" width="190" height="115" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="518" y="350" width="5" height="26" rx="2" fill="#8abfff"/><text x="536" y="370" fill="#8abfff" font-size="23" font-weight="650">/var</text><text x="522" y="402" fill="#d5e2ee" font-size="18">Changing data</text><path d="M480,260 L595,320" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="330" width="190" height="115" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="748" y="350" width="5" height="26" rx="2" fill="#8abfff"/><text x="766" y="370" fill="#8abfff" font-size="23" font-weight="650">/dev</text><text x="752" y="402" fill="#d5e2ee" font-size="18">Device entries</text><path d="M480,260 L825,320" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="495" width="280" height="100" rx="16" fill="#15283e" stroke="#c5adff" stroke-opacity=".55"/><rect x="238" y="515" width="5" height="26" rx="2" fill="#c5adff"/><text x="256" y="535" fill="#c5adff" font-size="23" font-weight="650">/home/learner</text><text x="242" y="567" fill="#d5e2ee" font-size="18">A sample home folder</text><path d="M365,445 L360,485" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="580" y="495" width="330" height="100" rx="16" fill="#15283e" stroke="#f1ca80" stroke-opacity=".55"/><rect x="598" y="515" width="5" height="26" rx="2" fill="#f1ca80"/><text x="616" y="535" fill="#f1ca80" font-size="23" font-weight="650">/mnt/data</text><text x="602" y="567" fill="#d5e2ee" font-size="18">Could mount another</text><text x="602" y="591" fill="#d5e2ee" font-size="18">filesystem</text><text x="46" y="649" fill="#9db4ca" font-size="15">Typical Linux examples. Directories and mount arrangements vary across Unix systems.</text></g></svg>