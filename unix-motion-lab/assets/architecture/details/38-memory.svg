<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc"><title id="title">Code, heap and stack</title><desc id="desc">These are useful conceptual regions. The stack tracks function calls, while the heap supports data with lifetimes controlled by the program or runtime.</desc><rect width="480" height="300" rx="12" fill="#f6f8f5"/><text x="240" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#163c32">Code, heap and stack</text><rect x="35" y="48" width="410" height="56" rx="8" fill="#deeee5" stroke="#9daea6"/><text x="240" y="82" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d302b">Code: instructions</text><rect x="35" y="126" width="410" height="56" rx="8" fill="#e4eaf6" stroke="#9daea6"/><text x="240" y="160" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d302b">Heap: dynamic data</text><rect x="35" y="204" width="410" height="56" rx="8" fill="#f4e9cf" stroke="#9daea6"/><text x="240" y="238" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d302b">Stack: call frames</text><text x="240" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#53665f">Read from top to bottom · simplified learning diagram</text></svg>