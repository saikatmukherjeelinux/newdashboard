<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc"><title id="title">The startup chain</title><desc id="desc">A typical startup begins with firmware, which starts a bootloader or boot path that loads the kernel. Exact steps vary by machine and operating system.</desc><rect width="480" height="300" rx="12" fill="#f6f8f5"/><text x="240" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#163c32">The startup chain</text><rect x="35" y="48" width="410" height="56" rx="8" fill="#deeee5" stroke="#9daea6"/><text x="240" y="82" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d302b">Firmware</text><path d="M240 107 v13 m-5 -5 l5 5 5 -5" fill="none" stroke="#62786e" stroke-width="2"/><rect x="35" y="126" width="410" height="56" rx="8" fill="#e4eaf6" stroke="#9daea6"/><text x="240" y="160" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d302b">Bootloader</text><path d="M240 185 v13 m-5 -5 l5 5 5 -5" fill="none" stroke="#62786e" stroke-width="2"/><rect x="35" y="204" width="410" height="56" rx="8" fill="#f4e9cf" stroke="#9daea6"/><text x="240" y="238" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d302b">Kernel</text><text x="240" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#53665f">Read from top to bottom · simplified learning diagram</text></svg>