<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">From application to network</title><desc id="desc">A socket is the program’s communication endpoint.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">From application to network</text><text x="46" y="128" fill="#a8bcd2" font-size="17">A socket is the program’s communication endpoint.</text><rect x="45" y="200" width="260" height="140" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="63" y="220" width="5" height="26" rx="2" fill="#8abfff"/><text x="81" y="240" fill="#8abfff" font-size="23" font-weight="650">APPLICATION</text><text x="67" y="272" fill="#d5e2ee" font-size="18">Creates a request</text><rect x="350" y="200" width="260" height="140" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="368" y="220" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="386" y="240" fill="#7fe3ca" font-size="23" font-weight="650">SOCKET</text><text x="372" y="272" fill="#d5e2ee" font-size="18">An endpoint for data</text><rect x="655" y="200" width="260" height="140" rx="16" fill="#15283e" stroke="#c5adff" stroke-opacity=".55"/><rect x="673" y="220" width="5" height="26" rx="2" fill="#c5adff"/><text x="691" y="240" fill="#c5adff" font-size="23" font-weight="650">KERNEL STACK</text><text x="677" y="272" fill="#d5e2ee" font-size="18">Protocols and routes</text><path d="M305,270 L340,270" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M610,270 L645,270" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="445" width="260" height="140" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="63" y="465" width="5" height="26" rx="2" fill="#8abfff"/><text x="81" y="485" fill="#8abfff" font-size="23" font-weight="650">REMOTE SERVICE</text><text x="67" y="517" fill="#d5e2ee" font-size="18">Receives the request</text><rect x="350" y="445" width="260" height="140" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="368" y="465" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="386" y="485" fill="#7fe3ca" font-size="23" font-weight="650">NETWORK</text><text x="372" y="517" fill="#d5e2ee" font-size="18">Other devices and</text><text x="372" y="541" fill="#d5e2ee" font-size="18">links</text><rect x="655" y="445" width="260" height="140" rx="16" fill="#15283e" stroke="#f1ca80" stroke-opacity=".55"/><rect x="673" y="465" width="5" height="26" rx="2" fill="#f1ca80"/><text x="691" y="485" fill="#f1ca80" font-size="23" font-weight="650">DRIVER + NIC</text><text x="677" y="517" fill="#d5e2ee" font-size="18">Network hardware</text><path d="M785,340 L785,435" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M655,515 L620,515" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M350,515 L315,515" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><text x="46" y="649" fill="#9db4ca" font-size="15">DNS lookup and application encryption add their own steps. Actual paths depend on the system.</text></g></svg>