<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">Memory is a managed workspace</title><desc id="desc">Virtual addresses are not physical RAM locations.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">Memory is a managed workspace</text><text x="46" y="128" fill="#a8bcd2" font-size="17">Virtual addresses are not physical RAM locations.</text><rect x="45" y="190" width="260" height="160" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="63" y="210" width="5" height="26" rx="2" fill="#8abfff"/><text x="81" y="230" fill="#8abfff" font-size="23" font-weight="650">PROCESS A</text><text x="67" y="262" fill="#d5e2ee" font-size="18">Code • stack • heap •</text><text x="67" y="286" fill="#d5e2ee" font-size="18">mapped data</text><rect x="45" y="400" width="260" height="160" rx="16" fill="#15283e" stroke="#c5adff" stroke-opacity=".55"/><rect x="63" y="420" width="5" height="26" rx="2" fill="#c5adff"/><text x="81" y="440" fill="#c5adff" font-size="23" font-weight="650">PROCESS B</text><text x="67" y="472" fill="#d5e2ee" font-size="18">Its own protected</text><text x="67" y="496" fill="#d5e2ee" font-size="18">virtual address space</text><rect x="375" y="285" width="230" height="160" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="393" y="305" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="411" y="325" fill="#7fe3ca" font-size="23" font-weight="650">MAPPING</text><text x="397" y="357" fill="#d5e2ee" font-size="18">Page tables and</text><text x="397" y="381" fill="#d5e2ee" font-size="18">hardware translate</text><text x="397" y="405" fill="#d5e2ee" font-size="18">addresses.</text><path d="M305,270 L365,325" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M305,480 L365,390" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="675" y="190" width="240" height="160" rx="16" fill="#15283e" stroke="#f1ca80" stroke-opacity=".55"/><rect x="693" y="210" width="5" height="26" rx="2" fill="#f1ca80"/><text x="711" y="230" fill="#f1ca80" font-size="23" font-weight="650">RAM</text><text x="697" y="262" fill="#d5e2ee" font-size="18">Active pages and</text><text x="697" y="286" fill="#d5e2ee" font-size="18">useful file caches</text><rect x="675" y="400" width="240" height="160" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="693" y="420" width="5" height="26" rx="2" fill="#8abfff"/><text x="711" y="440" fill="#8abfff" font-size="23" font-weight="650">STORAGE</text><text x="697" y="472" fill="#d5e2ee" font-size="18">Persistent files;</text><text x="697" y="496" fill="#d5e2ee" font-size="18">swap if configured</text><path d="M605,325 L665,270" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M605,390 L665,480" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><text x="46" y="649" fill="#9db4ca" font-size="15">Virtual memory is more than swap. Sharing and caching are deliberate, controlled mechanisms.</text></g></svg>