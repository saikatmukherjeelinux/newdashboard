<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">A request across the boundary</title><desc id="desc">Example: a program wants to read a file.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102137"/><stop offset="1" stop-color="#0a1021"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7fe3ca" stroke-width="1.5"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#85b2d1" opacity=".12"/></pattern></defs><rect width="960" height="680" rx="24" fill="url(#bg)"/><rect width="960" height="680" rx="24" fill="url(#dots)"/><circle cx="875" cy="40" r="150" fill="#227a75" opacity=".1"/><g font-family="system-ui, sans-serif"><text x="46" y="49" fill="#7fe3ca" font-size="13" letter-spacing="3">UNIX / INSIDE THE SYSTEM</text><text x="46" y="96" fill="#eff7ff" font-size="32" font-weight="700">A request across the boundary</text><text x="46" y="128" fill="#a8bcd2" font-size="17">Example: a program wants to read a file.</text><rect x="60" y="185" width="360" height="130" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="78" y="205" width="5" height="26" rx="2" fill="#8abfff"/><text x="96" y="225" fill="#8abfff" font-size="23" font-weight="650">APPLICATION</text><text x="82" y="257" fill="#d5e2ee" font-size="18">Calls a library function to</text><text x="82" y="281" fill="#d5e2ee" font-size="18">open or read a file.</text><rect x="540" y="185" width="360" height="130" rx="16" fill="#15283e" stroke="#8abfff" stroke-opacity=".55"/><rect x="558" y="205" width="5" height="26" rx="2" fill="#8abfff"/><text x="576" y="225" fill="#8abfff" font-size="23" font-weight="650">LIBRARY</text><text x="562" y="257" fill="#d5e2ee" font-size="18">Prepares a request when a</text><text x="562" y="281" fill="#d5e2ee" font-size="18">kernel service is needed.</text><path d="M420,250 L530,250" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M45 365 H915" stroke="#f1ca80" stroke-dasharray="9 8"/><text x="55" y="352" fill="#f1ca80" font-size="17">USER SPACE</text><text x="55" y="392" fill="#f1ca80" font-size="17">KERNEL SPACE</text><path d="M720,315 L720,425" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="435" width="360" height="135" rx="16" fill="#15283e" stroke="#7fe3ca" stroke-opacity=".55"/><rect x="558" y="455" width="5" height="26" rx="2" fill="#7fe3ca"/><text x="576" y="475" fill="#7fe3ca" font-size="23" font-weight="650">KERNEL</text><text x="562" y="507" fill="#d5e2ee" font-size="18">Checks access, performs work</text><text x="562" y="531" fill="#d5e2ee" font-size="18">and returns a result.</text><rect x="60" y="435" width="360" height="135" rx="16" fill="#15283e" stroke="#f1ca80" stroke-opacity=".55"/><rect x="78" y="455" width="5" height="26" rx="2" fill="#f1ca80"/><text x="96" y="475" fill="#f1ca80" font-size="23" font-weight="650">RESULT OR ERROR</text><text x="82" y="507" fill="#d5e2ee" font-size="18">Return bytes or an error code</text><text x="82" y="531" fill="#d5e2ee" font-size="18">to user space.</text><path d="M530,500 L430,500" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M240,435 L240,325" fill="none" stroke="#7fe3ca" stroke-width="2" marker-end="url(#arrow)"/><text x="46" y="649" fill="#9db4ca" font-size="15">A library call may use zero, one or several system calls. This is a simplified request path.</text></g></svg>